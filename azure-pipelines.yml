trigger:
- main

pool:
  vmImage: ubuntu-latest

parameters:
  - name: repoUrl
    displayName: "Repository URL to Analyze"
    type: string
    default: "https://github.com/roshni-aldrin/javaFiles"

  - name: branch
    displayName: "Branch"
    type: string
    default: "main"

variables:
  CARBON_THRESHOLD: '5'

steps:

# 1. Checkout
- checkout: self
  displayName: "Checkout Source Code"

# 2. Carbon Score Quality Gate
- bash: |
    set -euo pipefail
    echo "Running Carbon Score Quality Gate..."

    API_URL="https://greencode-bsg9gqg2dfebamdg.eastus-01.azurewebsites.net/analyze/repo"

    payload=$(jq -n \
      --arg repo "${{ parameters.repoUrl }}" \
      --arg branch "${{ parameters.branch }}" \
      '{repo_url: $repo, branch: $branch, git_username: null, git_token: null}')

    response=$(curl -sS -w "\n%{http_code}" -X POST \
      -H "Content-Type: application/json" \
      -d "$payload" \
      "$API_URL")

    http_body=$(echo "$response" | head -n -1)
    http_code=$(echo "$response" | tail -n1)

    echo "HTTP Status: $http_code"

    if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
      echo "##vso[task.logissue type=error]API call failed with HTTP $http_code"
      exit 1
    fi

    score=$(echo "$http_body" | jq -r '.summary.total_carbon_g')

    if [ -z "$score" ] || [ "$score" = "null" ]; then
      echo "##vso[task.logissue type=error]Carbon score not found"
      exit 1
    fi

    echo "Carbon Score: $score grams"

    fail=$(awk -v s="$score" -v t="$(CARBON_THRESHOLD)" 'BEGIN { if (s>t) print 1; else print 0 }')

    if [ "$fail" -eq 1 ]; then
      echo "##vso[task.logissue type=error]Carbon score $score exceeds threshold $(CARBON_THRESHOLD)"
      exit 1
    fi

    echo "Carbon score within limits."
  displayName: " Carbon Score Quality Gate"

# 3. Build (runs only if Carbon score passed)
- script: |
    echo "Running build..."
  displayName: "Build Project"
  condition: succeeded()

# 4. Test
- script: echo "Running tests..."
  displayName: "Run Tests"
  condition: succeeded()

# 5. Deploy
- script: echo "Deploying..."
  displayName: "Deploy Application"
  condition: succeeded()