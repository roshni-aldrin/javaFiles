trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  TARGET_REPO_URL: 'https://github.com/roshni-aldrin/javaFiles'
  TARGET_BRANCH: 'main'
  CARBON_THRESHOLD: '3'

steps:

- checkout: self
  displayName: "Checkout Source Code"

- bash: |
    set -euo pipefail
    echo "Running Carbon Score Quality Gate..."

    API_URL="https://greencode-bsg9gqg2dfebamdg.eastus-01.azurewebsites.net/analyze/repo"

    payload=$(jq -n \
      --arg repo "$(TARGET_REPO_URL)" \
      --arg branch "$(TARGET_BRANCH)" \
      '{repo_url: $repo, branch: $branch, git_username: null, git_token: null}')

    response=$(curl -sS -w "\n%{http_code}" -X POST \
      -H "Content-Type: application/json" \
      -d "$payload" \
      "$API_URL")

    http_body=$(echo "$response" | head -n -1)
    http_code=$(echo "$response" | tail -n1)

    echo "HTTP Status: $http_code"

    if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
      echo "##vso[task.logissue type=error]API call failed with HTTP $http_code"
      exit 1
    fi

    score=$(echo "$http_body" | jq -r '.summary.total_carbon_g')

    if [ -z "$score" ] || [ "$score" = "null" ]; then
      echo "##vso[task.logissue type=error]Carbon score not found in API response."
      exit 1
    fi

    echo "Carbon Score (grams): $score"
    echo "Threshold: $(CARBON_THRESHOLD)"

    fail=$(awk -v s="$score" -v t="$(CARBON_THRESHOLD)" 'BEGIN { if (s>t) print 1; else print 0 }')

    if [ "$fail" -eq 1 ]; then
      echo "##vso[task.logissue type=error]Carbon score $score exceeds threshold $(CARBON_THRESHOLD)"
      exit 1
    fi

    echo " Carbon score within acceptable limits."
  displayName: " Carbon Score Quality Gate"

- script: |
    echo "Starting build..."
    # Example for Java:
    # mvn clean package
    # Or for Gradle:
    # ./gradlew build
  displayName: "Build Project"
  condition: succeeded()     # runs ONLY if carbon gate passed

- script: |
    echo "Running tests..."
    # Example:
    # mvn test
    # ./gradlew test
  displayName: "Run Tests"
  condition: succeeded()     # only run if build succeeded

- script: |
    echo "Deploying application..."
    # Add deployment commands here
  displayName: "Deploy Application"
  condition: succeeded()     # only after successful tests