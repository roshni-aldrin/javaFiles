trigger:
- main

pr:
- main

pool:
  vmImage: ubuntu-latest

parameters:
  - name: repoUrl
    displayName: "Repository URL to Analyze"
    type: string
    default: "https://github.com/roshni-aldrin/javaFiles"

  - name: branch
    displayName: "Branch to Analyze"
    type: string
    default: "main"

variables:
  CARBON_THRESHOLD: '5'

stages:

- stage: CarbonGate
  displayName: "Carbon Score Quality Gate"
  jobs:
  - job: CarbonCheck
    steps:

    - checkout: self

    # ✅ Debug: Show actual repo folder structure on the agent
    - bash: |
        echo "=== REPO ROOT CONTENTS ==="
        ls -R "$(Build.SourcesDirectory)"
      displayName: "DEBUG: Show Repo Structure"

    # ✅ Corrected path: Scripts (capital S)
    - script: chmod +x "$(Build.SourcesDirectory)/Scripts/post-comment.sh"
      displayName: "Set Permissions for PR Comment Script"

    - bash: |
        set -euo pipefail
        echo "Calling Carbon Score API..."

        API_URL="https://greencode-bsg9gqg2dfebamdg.eastus-01.azurewebsites.net/analyze/repo"

        payload=$(jq -n \
          --arg repo "${{ parameters.repoUrl }}" \
          --arg branch "${{ parameters.branch }}" \
          '{repo_url: $repo, branch: $branch, git_username: null, git_token: null}')

        response=$(curl -sS -w "\n%{http_code}" -X POST \
          -H "Content-Type: application/json" \
          -d "$payload" \
          "$API_URL")

        http_body=$(echo "$response" | head -n -1)
        http_code=$(echo "$response" | tail -n1)

        if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
          echo "##vso[task.logissue type=error]API failed with status $http_code"
          exit 1
        fi

        score=$(echo "$http_body" | jq -r '.summary.total_carbon_g')

        if [ -z "$score" ] || [ "$score" = "null" ]; then
          echo "##vso[task.logissue type=error]Carbon score missing in response"
          exit 1
        fi

        echo "$http_body" > carbon-report.json

        echo "Carbon Score: $score"
        echo "Threshold: $(CARBON_THRESHOLD)"

        fail=$(awk -v s="$score" -v t="$(CARBON_THRESHOLD)" 'BEGIN {if (s>t) print 1; else print 0}')

        if [ "$fail" -eq 1 ]; then
          echo "##vso[task.logissue type=error]Score $score exceeds threshold $(CARBON_THRESHOLD)"
          exit 1
        fi

        echo "Carbon score within limit."

        repo_full="${{ parameters.repoUrl }}"
        repo_full=${repo_full#https://github.com/}
        repo_full=${repo_full%.git}

        if [ "$(System.PullRequest.PullRequestNumber)" != "" ]; then
          PR_NUMBER=$(System.PullRequest.PullRequestNumber)

          COMMENT="### ♻️ Carbon Score Report\n**Score:** $score g\n**Threshold:** $(CARBON_THRESHOLD) g\n**Status:** PASSED"

          echo "Posting comment to PR #$PR_NUMBER in $repo_full"

          # ✅ Corrected path here also
          "$(Build.SourcesDirectory)/Scripts/post-comment.sh" "$PR_NUMBER" "$repo_full" "$COMMENT"
        fi
      env:
        GITHUB_TOKEN: $(GITHUB_TOKEN)
      displayName: "Run Carbon API and Post PR Comment"

    - publish: carbon-report.json
      artifact: carbon-report
      displayName: "Publish Carbon Report Artifact"

- stage: Build
  dependsOn: CarbonGate
  condition: succeeded()
  displayName: "Build Stage"
  jobs:
  - job: BuildJob
    steps:
    - script: echo "Building project..."
      displayName: "Build"

- stage: Test
  dependsOn: Build
  condition: succeeded()
  displayName: "Test Stage"
  jobs:
  - job: TestJob
    steps:
    - script: echo "Running tests..."
      displayName: "Run Tests"

- stage: Deploy
  dependsOn: Test
  condition: succeeded()
  displayName: "Deploy Stage"
  jobs:
  - job: DeployJob
    steps:
    - script: echo "Deploying application..."
      displayName: "Deploy Application"